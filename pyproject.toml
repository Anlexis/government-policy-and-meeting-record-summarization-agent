[project]
name = "gov-c2-004"
version = "0.1.0"
description = "Government Policy & Meeting Record Summarization Agent — AgentCore Template"
requires-python = ">=3.11"
# The framework (agenticstar-agentcore) is not resolvable from the default public
# index — it is installed by CI from the platform package registry — so pinning it
# here would make `pip install -e .` fail. Everything the template itself imports
# at runtime is listed below.
dependencies = [
    "agenticstar-agentcore[marketplace,openai]==1.0.3",
    "pyyaml==6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.1.1",
    "pytest-cov==5.0.0",
    "pytest-asyncio==0.23.6",
    "ruff==0.4.4",
    "mypy==1.10.0",
    "httpx==0.27.0",
    "types-PyYAML==6.0.12.20260815",
]

[build-system]
requires = ["setuptools==68.2.2"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
# The framework base classes are distributed as an installed package whose public
# surface is intentionally loose in places; subclassing them is the documented
# extension mechanism, so it must not be reported as subclassing Any.
disallow_subclassing_any = false

[[tool.mypy.overrides]]
module = ["framework.*", "shared.*"]
ignore_missing_imports = true
